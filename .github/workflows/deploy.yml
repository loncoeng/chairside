# Deploys main to Cloudflare. Calls test.yml rather than copying its steps.
#
# Required secrets:
#   CLOUDFLARE_API_TOKEN    Workers Scripts:Edit and D1:Edit
#   CLOUDFLARE_ACCOUNT_ID   where it goes

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reset:
        description: Empty the live database and write the sample again from nothing
        type: boolean
        default: false

# One at a time, never cancelled: a cancelled deploy leaves the live version unclear.
concurrency:
  group: deploy
  cancel-in-progress: false

# Read-only token instead of the wider repo default: nothing here writes back,
# and a compromised step shouldn't be able to.
permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  deploy:
    needs: test
    # A fork has no secrets and would fail every time.
    if: github.repository == 'loncoeng/chairside'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build

      # Migrate before deploying the code that needs the tables. Idempotent (wrangler
      # records applied migrations). Non-interactive runs skip the prompt but still back up.
      - name: Bring the database up to date
        run: npx wrangler d1 migrations apply chairside --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Only when started by hand with "reset" ticked. See seed/demo-reset.sql.
      - name: Empty the database
        if: inputs.reset
        run: npx wrangler d1 execute chairside --remote --file seed/demo-reset.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Demo shop settings (room, menu, hours), public instance only. INSERT OR IGNORE
      # with explicit ids, so re-running every deploy is safe.
      - name: Put the sample rows in
        run: |
          npx wrangler d1 execute chairside --remote --file seed/demo.sql
          # Public holidays for the three regions. Reference data, not sample data.
          npx wrangler d1 execute chairside --remote --file seed/holidays.sql
          # Sample guest addresses and birthdays. Fills empty fields only, so UI edits survive.
          npx wrangler d1 execute chairside --remote --file seed/demo-customer-details.sql
          # seed/logins.sql is not applied here, only to the browser demo DB
          # (scripts/build-demo-db.ts). The live instance has no public login.
          npx wrangler d1 execute chairside --remote --file seed/demo-no-logins.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ~1 MB / 16,000 rows. Re-applying costs a sixth of a day's free D1 writes,
      # so it runs only when the expected and actual booking counts differ.
      - name: Put the sample months in, if they are not there
        run: |
          want=$(cat seed/demo-bookings.count)
          npx wrangler d1 execute chairside --remote --json --command "SELECT count(*) AS n FROM bookings" > /tmp/count.json
          have=$(grep -o '"n":[[:space:]]*[0-9]*' /tmp/count.json | grep -o '[0-9]*$' | head -1)
          echo "on file: ${want}, in the database: ${have:-unknown}"

          if [ "$want" = "$have" ]; then
            echo "already there"
            exit 0
          fi

          # One file per call: a single large call resets D1's Durable Object (per-call size limit).
          # Clear first. bookings.customer_id has no cascade (deleting a customer must not
          # drop their history), so bookings go before customers.
          for part in demo-clear demo-customers demo-bookings demo-items demo-events demo-payments demo-customer-details; do
            echo "applying ${part}"
            npx wrangler d1 execute chairside --remote --file "seed/${part}.sql"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Before deploy: setting a secret creates a Worker version, and two versions back to
      # back leave the edge serving both for about a minute. Without a key, sign-in returns
      # 503 (src/db/session.ts). Fails harmlessly on a Worker's first deploy.
      - name: Put the signing key in place
        run: |
          if [ -z "$SESSION_SECRET" ]; then
            echo "no SESSION_SECRET on file here — leaving whatever the Worker has"
            exit 0
          fi
          printf '%s' "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET \
            || echo "could not set it — is this the Worker's first deploy?"
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ship it
        run: npx wrangler deploy --var BUILD:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Verify the live deploy. Unauthenticated requests go first so a broken auth gate fails the run.
      - name: Does it answer
        run: |
          base=https://chairside.loncoeng.dev

          # Retry: a new version reaches edge locations over several seconds, so adjacent
          # requests can hit different versions.
          expect() {
            want=$1; shift
            for try in 1 2 3 4 5 6; do
              got=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 20 "$@" || true)
              if [ "$got" = "$want" ]; then
                echo "HTTP $got"
                return 0
              fi
              sleep 5
            done
            echo "HTTP $got — wanted $want"
            head -c 200 /tmp/body; echo
            return 1
          }

          # Wait until /api/version reports this commit 6 times in a row (one colo is not all).
          # The bundle hash alone misses API-only changes.
          bundle=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)
          echo "waiting for ${GITHUB_SHA} and $bundle"

          agreed=0
          for attempt in $(seq 1 25); do
            live=$(curl -s --max-time 20 "$base/api/version" || true)
            page=$(curl -s -o /tmp/page -w '%{http_code}' --max-time 20 "$base/" || true)
            if echo "$live" | grep -q "$GITHUB_SHA" && [ "$page" = "200" ] && grep -q "$bundle" /tmp/page; then
              agreed=$((agreed + 1))
              echo "this commit answered ($agreed/6)"
              [ "$agreed" -ge 6 ] && break
            else
              agreed=0
              echo "not yet — worker says ${live:-nothing}, page HTTP $page (attempt $attempt/25)"
            fi
            sleep 5
          done
          if [ "$agreed" -lt 6 ]; then
            echo "deployed, but the edge never settled on this commit"
            exit 1
          fi

          # These expose customer data and must reject requests without a session.
          for path in "/api/people" "/api/people/1" "/api/customers" "/api/room" "/api/day?date=2026-09-23" "/api/revenue?month=2026-09" "/api/shop"; do
            printf 'GET %-32s with no session -> ' "$path"
            expect 401 "$base$path" || exit 1
          done

          # Writes too.
          printf 'POST %-31s with no session -> ' "/api/records"
          expect 401 -X POST -H 'content-type: application/json' \
            -d '{"customerId":1,"body":"probe"}' "$base/api/records" || exit 1

          printf 'POST %-31s with no session -> ' "/api/people"
          expect 401 -X POST -H 'content-type: application/json' \
            -d '{"name":"probe"}' "$base/api/people" || exit 1

          printf 'PUT  %-31s with no session -> ' "/api/people/1"
          expect 401 -X PUT -H 'content-type: application/json' \
            -d '{"name":"probe"}' "$base/api/people/1" || exit 1

          # A write that is not JSON is refused before anything reads it (cross-site forms can't send JSON).
          printf 'POST %-31s as plain text -> ' "/api/people"
          expect 415 -X POST -H 'content-type: text/plain' -d 'name=probe' "$base/api/people" || exit 1

          echo "the doors are locked"

          # The demo's published password must not work here (seed/logins.sql is not applied).
          printf 'POST %-31s demo password -> ' "/api/session"
          expect 401 -X POST -H 'content-type: application/json' \
            -d '{"loginId":"aoi","password":"chairside-demo"}' "$base/api/session" || exit 1
          echo "the published password does not open the live instance"

          # No live password exists, so mint tokens with SESSION_SECRET via the Worker's own issue().
          if [ -z "$SESSION_SECRET" ]; then
            echo
            echo "No SESSION_SECRET on file, so this check cannot make a session."
            echo "Add SESSION_SECRET to this repository's Actions secrets."
            exit 1
          fi
          owner=$(node scripts/mint-session.ts 1 owner)
          stylist=$(node scripts/mint-session.ts 2 stylist)

          # Check the body, not just the status: a broken run_worker_first returns the SPA HTML with 200.
          code=$(curl -s -o /tmp/api -w '%{http_code}' --max-time 20 -H "cookie: __Host-chairside_session=$owner" "$base/api/room" || true)
          echo "GET /api/room -> HTTP $code"
          head -c 300 /tmp/api; echo
          if [ "$code" != "200" ] || ! grep -q '"seats"' /tmp/api; then
            echo "the API did not answer with JSON from the database"
            exit 1
          fi

          # 12 seats + 8 staff from seed/demo.sql; empty arrays would pass a shape-only check.
          rows=$(grep -o '"id"' /tmp/api | wc -l)
          echo "rows returned (seats + staff): $rows"
          if [ "$rows" -lt 20 ]; then
            echo "the database answered, but came back short"
            exit 1
          fi
          echo "the database answers"

          # Use a fixed sample date: an empty day is a valid reply.
          code=$(curl -s -o /tmp/day -w '%{http_code}' --max-time 20 -H "cookie: __Host-chairside_session=$owner" "$base/api/day?date=2026-09-23" || true)
          echo "GET /api/day -> HTTP $code"
          lines=$(grep -o '"itemId"' /tmp/day | wc -l)
          echo "treatments on that day: $lines"
          if [ "$code" != "200" ] || [ "$lines" -lt 20 ]; then
            head -c 300 /tmp/day; echo
            echo "the calendar did not answer with a day's work"
            exit 1
          fi
          echo "the calendar answers"

          # Role gate (src/db/permissions.ts): stylists can't see revenue.
          printf 'GET  %-31s as a stylist  -> ' "/api/revenue"
          expect 403 -H "cookie: __Host-chairside_session=$stylist" "$base/api/revenue?month=2026-09" || exit 1
          echo "the roles hold"
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
