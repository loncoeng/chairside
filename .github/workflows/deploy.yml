# Ships whatever lands on main to Cloudflare.
#
# Tests are not copied in here; test.yml is called, so the two cannot drift.
#
# Required secrets:
#   CLOUDFLARE_API_TOKEN    Workers Scripts:Edit and D1:Edit
#   CLOUDFLARE_ACCOUNT_ID   where it goes

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never two at once. Cancelling one mid-flight leaves it unclear which
# version is live.
concurrency:
  group: deploy
  cancel-in-progress: false

# The token this job is given. Without this block it gets the repository's
# default, which is wider than anything here needs: nothing writes back to the
# repository, and a step that is compromised should not be able to.
permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  deploy:
    needs: test
    # A fork has no secrets and would fail every time.
    if: github.repository == 'loncoeng/chairside'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build

      # Before the code that expects the tables, not after. A deploy that
      # lands first would run against a database it does not match.
      #
      # Applying an already-applied migration is a no-op: wrangler keeps its
      # own record in the database, so re-running this on every push is safe.
      # The command asks for confirmation interactively; on a non-interactive
      # terminal it skips the question and still takes a backup first.
      - name: Bring the database up to date
        run: npx wrangler d1 migrations apply chairside --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Sample rows, for the public instance only. INSERT OR IGNORE with the
      # ids written out, so running it on every deploy adds nothing the
      # second time. A shop would never apply this file.
      # The shop's own settings — the room, the menu, the hours. Small, and
      # applied every time so a correction here reaches the instance.
      - name: Put the sample rows in
        run: |
          npx wrangler d1 execute chairside --remote --file seed/demo.sql
          # Public holidays for the three regions. Reference data rather than
          # sample data: a shop running this would apply it too.
          npx wrangler d1 execute chairside --remote --file seed/holidays.sql
          # Addresses and birthdays for the sample guests. Fills only empty
          # fields, so re-applying it changes nothing and keeps any edit made
          # through the screen.
          npx wrangler d1 execute chairside --remote --file seed/demo-customer-details.sql
          # seed/logins.sql is deliberately NOT applied here. It goes into the
          # browser demo's database instead (scripts/build-demo-db.ts), where the
          # password can be printed on screen because that database is invented
          # and lives in the visitor's browser.
          #
          # So the live instance has no account anybody can sign into. What a
          # visitor wrote there would be waiting for the next visitor — and the
          # next visitor might be a shop being shown the thing.
          npx wrangler d1 execute chairside --remote --file seed/demo-no-logins.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Three months of bookings is about a megabyte and sixteen thousand
      # rows. Re-applying that on every push spends a sixth of a day's free
      # writes to change nothing, so it only runs when the count on file and
      # the count in the database disagree.
      # Three months of bookings is about a megabyte and sixteen thousand
      # rows. Re-applying that on every push spends a sixth of a day's free
      # writes to change nothing, so it only runs when the count on file and
      # the count in the database disagree.
      - name: Put the sample months in, if they are not there
        run: |
          want=$(cat seed/demo-bookings.count)
          npx wrangler d1 execute chairside --remote --json --command "SELECT count(*) AS n FROM bookings" > /tmp/count.json
          have=$(grep -o '"n":[[:space:]]*[0-9]*' /tmp/count.json | grep -o '[0-9]*$' | head -1)
          echo "on file: ${want}, in the database: ${have:-unknown}"

          if [ "$want" = "$have" ]; then
            echo "already there"
            exit 0
          fi

          # One file per table, applied in turn. All of it in a single call
          # reset the database's Durable Object outright — the limit is on
          # how much one call carries, not on any one statement.
          # The clear goes first. bookings.customer_id has no cascade on it —
          # on purpose, so that removing a customer cannot silently take their
          # history with them — which means the bookings have to be gone
          # before the guests they point at can be.
          for part in demo-clear demo-customers demo-bookings demo-items demo-events demo-payments demo-customer-details; do
            echo "applying ${part}"
            npx wrangler d1 execute chairside --remote --file "seed/${part}.sql"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The signing key, if this repository has one on file. Before the
      # deploy, not after: putting a secret on a Worker makes a new version
      # of it, and two versions in a row leave the edge answering from both
      # for a minute. The check below caught exactly that — /api/people came
      # back 401 from the new code while /api/people/1 came back 200 from the
      # old, one request apart.
      #
      # Without a key the Worker refuses every sign-in with a 503 rather than
      # letting anybody in — see src/db/session.ts. Keeping it here as well as
      # on the Worker means a Worker rebuilt from scratch gets it back on the
      # next push.
      #
      # On a Worker that does not exist yet this has nothing to attach to, so
      # a failure here is reported and stepped over; the next push sets it.
      - name: Put the signing key in place
        run: |
          if [ -z "$SESSION_SECRET" ]; then
            echo "no SESSION_SECRET on file here — leaving whatever the Worker has"
            exit 0
          fi
          printf '%s' "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET \
            || echo "could not set it — is this the Worker's first deploy?"
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ship it
        run: npx wrangler deploy --var BUILD:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Check that what was shipped actually answers. Without this, a deploy
      # that put nothing reachable on the internet is recorded as a success.
      #
      # The order here is deliberate. The doors are tried locked first: if
      # this step only ever asked with a session in hand, the day the gate
      # stops working it would still go green.
      - name: Does it answer
        run: |
          base=https://chairside.loncoeng.workers.dev

          # Ask until the answer is the one expected, rather than asking once.
          #
          # A new version of a Worker reaches the edge over a few seconds, and
          # not everywhere at the same moment. The first run of this step read
          # 401 from /api/people and 200 from /api/people/1 one request apart:
          # two adjacent requests, two versions of the code. A check that
          # treats the first unexpected answer as a finding reports that as a
          # hole in the gate, which it was not.
          expect() {
            want=$1; shift
            for try in 1 2 3 4 5 6; do
              got=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 20 "$@" || true)
              if [ "$got" = "$want" ]; then
                echo "HTTP $got"
                return 0
              fi
              sleep 5
            done
            echo "HTTP $got — wanted $want"
            head -c 200 /tmp/body; echo
            return 1
          }

          # Wait for this commit by name, and then keep asking: one colo
          # answering with the new build does not mean the rest have it.
          #
          # Asking the Worker rather than looking at the bundle filename: a
          # change that touches only the API leaves the assets byte-identical,
          # and a check that watched the bundle would pass against the old
          # code without noticing.
          bundle=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)
          echo "waiting for ${GITHUB_SHA} and $bundle"

          agreed=0
          for attempt in $(seq 1 25); do
            live=$(curl -s --max-time 20 "$base/api/version" || true)
            page=$(curl -s -o /tmp/page -w '%{http_code}' --max-time 20 "$base/" || true)
            if echo "$live" | grep -q "$GITHUB_SHA" && [ "$page" = "200" ] && grep -q "$bundle" /tmp/page; then
              agreed=$((agreed + 1))
              echo "this commit answered ($agreed/6)"
              [ "$agreed" -ge 6 ] && break
            else
              agreed=0
              echo "not yet — worker says ${live:-nothing}, page HTTP $page (attempt $attempt/25)"
            fi
            sleep 5
          done
          if [ "$agreed" -lt 6 ]; then
            echo "deployed, but the edge never settled on this commit"
            exit 1
          fi

          # Locked. Every one of these returned customer names, phone numbers
          # and treatment notes to anybody who asked, before the sign-in
          # existed. They are named here so that they cannot go back to it
          # without this failing.
          for path in "/api/people" "/api/people/1" "/api/customers" "/api/room" "/api/day?date=2026-09-23" "/api/revenue?month=2026-09" "/api/shop"; do
            printf 'GET %-32s with no session -> ' "$path"
            expect 401 "$base$path" || exit 1
          done

          # Writing, too. A gate that only covers reading is not a gate.
          printf 'POST %-31s with no session -> ' "/api/records"
          expect 401 -X POST -H 'content-type: application/json' \
            -d '{"customerId":1,"body":"probe"}' "$base/api/records" || exit 1

          printf 'POST %-31s with no session -> ' "/api/people"
          expect 401 -X POST -H 'content-type: application/json' \
            -d '{"name":"probe"}' "$base/api/people" || exit 1

          printf 'PUT  %-31s with no session -> ' "/api/people/1"
          expect 401 -X PUT -H 'content-type: application/json' \
            -d '{"name":"probe"}' "$base/api/people/1" || exit 1

          echo "the doors are locked"

          # The demo's published account must not open the live instance.
          # seed/logins.sql is not applied to D1, and this is what says so.
          printf 'POST %-31s demo password -> ' "/api/session"
          expect 401 -X POST -H 'content-type: application/json' \
            -d '{"loginId":"aoi","password":"chairside-demo"}' "$base/api/session" || exit 1
          echo "the published password does not open the live instance"

          # Now with a session of our own. There is no password to sign in with,
          # so the check signs a token using the key it already holds — the same
          # issue() the Worker calls, not a second implementation of it.
          if [ -z "$SESSION_SECRET" ]; then
            echo
            echo "No SESSION_SECRET on file, so this check cannot make a session."
            echo "Add SESSION_SECRET to this repository's Actions secrets."
            exit 1
          fi
          owner=$(node scripts/mint-session.ts 1 owner)
          stylist=$(node scripts/mint-session.ts 2 stylist)

          # run_worker_first sends /api/* to the Worker. If that is wrong, the
          # SPA fallback returns the HTML page with a 200 on it, so the body
          # is checked, not just the status.
          code=$(curl -s -o /tmp/api -w '%{http_code}' --max-time 20 -H "cookie: chairside_session=$owner" "$base/api/room" || true)
          echo "GET /api/room -> HTTP $code"
          head -c 300 /tmp/api; echo
          if [ "$code" != "200" ] || ! grep -q '"seats"' /tmp/api; then
            echo "the API did not answer with JSON from the database"
            exit 1
          fi

          # 12 seats and 8 on the team, from seed/demo.sql. Empty arrays are
          # still valid JSON and would pass a check that only looked at shape.
          rows=$(grep -o '"id"' /tmp/api | wc -l)
          echo "rows returned (seats + staff): $rows"
          if [ "$rows" -lt 20 ]; then
            echo "the database answered, but came back short"
            exit 1
          fi
          echo "the database answers"

          # And the calendar. /api/day is what stage three is about, and an
          # empty day is a valid reply — so the sample week is asked for by
          # name rather than trusting whatever "today" happens to be.
          code=$(curl -s -o /tmp/day -w '%{http_code}' --max-time 20 -H "cookie: chairside_session=$owner" "$base/api/day?date=2026-09-23" || true)
          echo "GET /api/day -> HTTP $code"
          lines=$(grep -o '"itemId"' /tmp/day | wc -l)
          echo "treatments on that day: $lines"
          if [ "$code" != "200" ] || [ "$lines" -lt 20 ]; then
            head -c 300 /tmp/day; echo
            echo "the calendar did not answer with a day's work"
            exit 1
          fi
          echo "the calendar answers"

          # A stylist is not the owner. The role gate lives in one table
          # (src/db/permissions.ts) and this is the live proof it is wired in.
          printf 'GET  %-31s as a stylist  -> ' "/api/revenue"
          expect 403 -H "cookie: chairside_session=$stylist" "$base/api/revenue?month=2026-09" || exit 1
          echo "the roles hold"
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
