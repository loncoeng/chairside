# Ships whatever lands on main to Cloudflare.
#
# Tests are not copied in here; test.yml is called, so the two cannot drift.
#
# Required secrets:
#   CLOUDFLARE_API_TOKEN    Workers Scripts:Edit and D1:Edit
#   CLOUDFLARE_ACCOUNT_ID   where it goes

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never two at once. Cancelling one mid-flight leaves it unclear which
# version is live.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  deploy:
    needs: test
    # A fork has no secrets and would fail every time.
    if: github.repository == 'loncoeng/chairside'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build

      # Before the code that expects the tables, not after. A deploy that
      # lands first would run against a database it does not match.
      #
      # Applying an already-applied migration is a no-op: wrangler keeps its
      # own record in the database, so re-running this on every push is safe.
      # The command asks for confirmation interactively; on a non-interactive
      # terminal it skips the question and still takes a backup first.
      - name: Bring the database up to date
        run: npx wrangler d1 migrations apply chairside --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Sample rows, for the public instance only. INSERT OR IGNORE with the
      # ids written out, so running it on every deploy adds nothing the
      # second time. A shop would never apply this file.
      - name: Put the sample rows in
        run: npx wrangler d1 execute chairside --remote --file seed/demo.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ship it
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Check that what was shipped actually answers. Without this, a deploy
      # that put nothing reachable on the internet is recorded as a success.
      #
      # The API is checked too, and separately. The page is static and will
      # keep loading with the database gone, so a page that renders says
      # nothing about whether D1 is reachable.
      - name: Does it answer
        run: |
          base=https://chairside.loncoeng.workers.dev
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/page -w '%{http_code}' --max-time 20 "$base/" || true)
            if [ "$code" = "200" ] && grep -q 'chairside' /tmp/page; then
              echo "the page answers"
              break
            fi
            echo "not yet (HTTP $code) — attempt $attempt/5"
            sleep 10
            if [ "$attempt" = "5" ]; then echo "deployed, but nothing answered"; exit 1; fi
          done

          # run_worker_first sends /api/* to the Worker. If that is wrong, the
          # SPA fallback returns the HTML page with a 200 on it, so the body
          # is checked, not just the status.
          code=$(curl -s -o /tmp/api -w '%{http_code}' --max-time 20 "$base/api/room" || true)
          echo "GET /api/room -> HTTP $code"
          head -c 400 /tmp/api; echo
          if [ "$code" != "200" ]; then
            echo "the API did not answer"
            exit 1
          fi
          if ! grep -q '"seats"' /tmp/api; then
            echo "the API answered, but not with JSON from the database"
            exit 1
          fi

          # 12 seats and 8 on the team, from seed/demo.sql. A reply with empty
          # arrays is still valid JSON, and would pass a check that only looked
          # at the shape.
          seats=$(grep -o '"id"' /tmp/api | wc -l)
          echo "rows returned (seats + staff): $seats"
          if [ "$seats" -lt 20 ]; then
            echo "the database answered, but came back short"
            exit 1
          fi
          echo "the database answers"
