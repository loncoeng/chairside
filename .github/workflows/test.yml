name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by deploy, so that nothing ships without passing first. Writing
  # the same steps into deploy would let the two drift apart.
  workflow_call:
    secrets:
      FORBIDDEN_TERMS:
        required: false

# The token this job is given. Without this block it gets the repository's
# default, which is wider than anything here needs: nothing writes back to the
# repository, and a step that is compromised should not be able to.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # publish-guard reads the whole history, so a shallow clone would
          # make the check meaningless.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # Build first, then test. src/ui/app.test.ts mounts the real app and
      # serves the real demo database and WebAssembly out of public/, which is
      # where the build puts them — run the other way round and that test has
      # nothing to serve.
      #
      # `npm run build` runs the type check itself, so there is no separate
      # step for it.
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # The shop's name, the owner's name and the address must not reach the
      # history. A public repository cannot carry that list in a committed
      # config file — writing the terms down to forbid them would publish
      # them — so they arrive from a secret and the config is built here.
      #
      # An unset secret skips the check loudly. Passing silently would be
      # worse than failing.
      - name: Nothing identifying in the history
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          if [ -z "${FORBIDDEN_TERMS}" ]; then
            echo "::warning::FORBIDDEN_TERMS is not set — the history was not checked."
            exit 0
          fi
          python -m pip install --quiet publish-guard
          python - <<'PY' > publish-guard.generated.toml
          import json, os
          terms = [t.strip() for t in os.environ["FORBIDDEN_TERMS"].splitlines() if t.strip()]
          print("[forbidden]")
          print("terms = [")
          for t in terms:
              # json.dumps escapes quotes and backslashes the way a TOML basic
              # string needs. repr() with the quotes swapped looks like it does
              # and breaks on the first term carrying either.
              print("  " + json.dumps(t, ensure_ascii=False) + ",")
          print("]")
          PY
          publish-guard verify . --config publish-guard.generated.toml
          rm -f publish-guard.generated.toml
