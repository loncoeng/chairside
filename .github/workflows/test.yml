name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by deploy.yml so nothing ships untested and the steps can't drift.
  workflow_call:
    secrets:
      FORBIDDEN_TERMS:
        required: false

# Read-only token: nothing writes to the repo, and a compromised step shouldn't be able to.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # publish-guard scans the full history.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # Type check and bundle. Tests don't need it: `npm test` builds the demo DB and wasm itself.
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Identifying terms (shop, owner, address) come from a secret, since committing
      # the list would publish it. An unset secret skips the check with a warning.
      - name: Nothing identifying in the history
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          if [ -z "${FORBIDDEN_TERMS}" ]; then
            echo "::warning::FORBIDDEN_TERMS is not set — the history was not checked."
            exit 0
          fi
          # Pinned by hash: this step holds the secret, so what runs here must be exactly what was reviewed.
          printf '%s\n' 'publish-guard==0.1.1 --hash=sha256:b9962a4a79ab47bccf78bb9e3368d92923674a188577300266d74714730481e6' > guard-requirements.txt
          python -m pip install --quiet --no-deps --require-hashes -r guard-requirements.txt
          rm -f guard-requirements.txt
          python - <<'PY' > publish-guard.generated.toml
          import json, os
          terms = [t.strip() for t in os.environ["FORBIDDEN_TERMS"].splitlines() if t.strip()]
          print("[forbidden]")
          print("terms = [")
          for t in terms:
              # json.dumps escapes quotes and backslashes as a TOML basic string needs; repr() does not.
              print("  " + json.dumps(t, ensure_ascii=False) + ",")
          print("]")
          PY
          publish-guard verify . --config publish-guard.generated.toml
          rm -f publish-guard.generated.toml
