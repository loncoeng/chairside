name = "chairside"
compatibility_date = "2026-09-23"

# Default is true, but leaving it implicit prints a warning on every deploy.
workers_dev = true

# No per-version preview URLs: unused, and each one is another public endpoint.
preview_urls = false

# Top-level keys must sit above the first [section]; below it they are silently ignored.

# The API. Static files are served without invoking it.
main = "./src/worker/index.ts"

# Live commit, set at deploy with --var BUILD:<sha>. A Worker-only change leaves
# the asset hashes unchanged, so the post-deploy check waits on this instead.
[vars]
BUILD = "dev"

# SESSION_SECRET is set with `wrangler secret put SESSION_SECRET`. Without it the
# Worker refuses all sign-ins instead of falling back to a guessable key.

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
# Otherwise unmatched /api paths hit the SPA fallback and return HTML with a 200.
run_worker_first = ["/api/*"]

# D1 is SQLite, so the same schema runs on a shop PC and in the browser demo.
# database_id is not a credential (useless without an API token). Committing it
# keeps a fresh clone from silently creating a second database.
[[d1_databases]]
binding = "DB"
database_name = "chairside"
database_id = "d41da5eb-cb84-4a59-ad0c-4c5d0cc6ec72"
migrations_dir = "./migrations"
