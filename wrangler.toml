name = "chairside"
compatibility_date = "2026-09-23"

# Published on workers.dev. Enabled by default, but leaving it implicit
# prints a warning on every deploy.
workers_dev = true

# A per-version preview URL for each deploy. Not used here, and every URL
# that exists is one more thing published.
preview_urls = false

# Anything below a [section] header belongs to that section, so these two
# have to sit above it. Written underneath, they are silently ignored and
# the setting never takes effect.

# The interface ships as static files. The API comes later.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
