name = "chairside"
compatibility_date = "2026-09-23"

# Published on workers.dev. Enabled by default, but leaving it implicit
# prints a warning on every deploy.
workers_dev = true

# A per-version preview URL for each deploy. Not used here, and every URL
# that exists is one more thing published.
preview_urls = false

# Anything below a [section] header belongs to that section, so these two
# have to sit above it. Written underneath, they are silently ignored and
# the setting never takes effect.

# The API. Static files are still served without waking this up.
main = "./src/worker/index.ts"

# Which commit is live. Overridden at deploy time with --var BUILD:<sha>.
#
# Static assets carry a content hash in their filename, so waiting for a
# particular bundle proves the new assets are being served. A Worker-only
# change has no such signal, and a check run straight after a deploy passes
# against the code that was there before. This is that signal.
[vars]
BUILD = "dev"

# SESSION_SECRET is not here. It is set with `wrangler secret put
# SESSION_SECRET`, so it never enters the repository — and the Worker refuses
# to sign anybody in without it rather than falling back to something
# guessable. A shop that cannot sign in is a bad afternoon; a shop whose
# session tokens anybody can mint is a customer list on the open internet.

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
# Without this, an unmatched path falls to the SPA fallback and /api/room
# comes back as the HTML page with a 200 on it — which looks like it works
# until something tries to parse it.
run_worker_first = ["/api/*"]

# The database. SQLite underneath, which is what lets the same schema run on a
# shop PC and in the browser demo.
#
# database_id is an identifier, not a credential — it is useless without an API
# token — so it belongs in the repository. Committing it is what makes a fresh
# clone deploy against the right database instead of silently creating a second
# one.
[[d1_databases]]
binding = "DB"
database_name = "chairside"
database_id = "d41da5eb-cb84-4a59-ad0c-4c5d0cc6ec72"
migrations_dir = "./migrations"
